<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | CareerPath</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="script.js"></script>
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">

<header class="header">
  <a href="index.html" class="logo">
    <div class="logo-icon">✦</div>
    Career<span>Path</span>
  </a>

  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="index.html#careers">Careers</a></li>
      <li><a href="counselor.html">Counselors</a></li>
      <li><a href="signup.html" class="btn-primary btn-sm">Create Account</a></li>
    </ul>
  </nav>
</header>

<div class="auth-wrapper">
  <div class="login-box">
    <div class="badge badge-primary" style="margin-bottom: 12px;">Student & Mentee Portal</div>
    <h2>Welcome Back</h2>
    <p class="subtitle">Enter your credentials to access your personalized career roadmaps and counselor appointments.</p>

    <form onsubmit="login(event)">
      <div class="form-group">
        <label>Email Address</label>
        <div class="input-field-wrapper">
          <input type="email" id="login-email" placeholder="name@domain.com" required value="alex.student@careerpath.edu">
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-field-wrapper">
          <input type="password" placeholder="••••••••" required value="SecurePass123!">
        </div>
      </div>

      <button type="submit" class="btn-primary" onclick="login(event)">Sign In to Portal →</button>
    </form>

    <div class="demo-login-bar">
      <button type="button" class="demo-btn" onclick="fillDemoAuth('signin')">⚡ Quick-Fill Demo Account</button>
    </div>

    <p>New to CareerPath? <a href="signup.html">Create an account</a></p>
  </div>
</div>

<div id="toast-container"></div>

</body>
</html>
