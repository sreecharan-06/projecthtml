<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="script.js"></script>
</head>
<body>

<div class="login-box">
  <h2>Create Account</h2>

  <button class="btn-primary" onclick="signup()">Sign Up</button>

</div>

</body>
</html>
